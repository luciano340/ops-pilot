services:
  app:
    build:
      context: .
      target: runtime
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-development-only-change-me}
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: ${POSTGRES_DB:-ops_pilot}
      DB_USER: ${POSTGRES_USER:-ops_pilot}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-ops_pilot}
      DB_HOST: db
      DB_PORT: "5432"
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ops_pilot}
      POSTGRES_USER: ${POSTGRES_USER:-ops_pilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ops_pilot}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ops_pilot} -d ${POSTGRES_DB:-ops_pilot}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
